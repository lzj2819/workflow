<span :class="{ 'bg-[#ecfdf3] text-[#067647]': tone === 'success', 'bg-[#fef3f2] text-[#b42318]': tone === 'danger', 'bg-[#fffaeb] text-[#b54708]': tone === 'warning', 'bg-[#f2f4f7] text-[#475467]': tone === 'neutral' }" class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold leading-none">{{ status }}</span>
