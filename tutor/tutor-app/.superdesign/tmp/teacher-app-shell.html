<div class="min-h-screen bg-[#f6f8fc] font-sans text-[#172033]" style="font-family: 'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <aside class="fixed inset-y-0 left-0 hidden w-[232px] flex-col border-r border-slate-200 bg-white px-4 py-6 lg:flex">
    <div class="mb-9 flex items-center gap-3 px-2">
      <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-[#173b67] text-base font-bold text-white">T</div>
      <div><p class="text-sm font-bold text-[#172033]">Tutor</p><p class="text-xs text-slate-500">教师工作台</p></div>
    </div>
    <nav class="space-y-1 text-sm">
      <a :href="coursesHref" :class="{ 'bg-[#eaf1fb] text-[#173b67]': activeItem === 'courses' }" class="flex items-center gap-3 rounded-lg px-3 py-2.5 font-medium text-slate-600">课程与提交</a>
      <a :href="presentationsHref" :class="{ 'bg-[#eaf1fb] text-[#173b67]': activeItem === 'presentations' }" class="flex items-center gap-3 rounded-lg px-3 py-2.5 font-medium text-slate-600">展示视图</a>
      <a :href="retentionHref" :class="{ 'bg-[#eaf1fb] text-[#173b67]': activeItem === 'retention' }" class="flex items-center gap-3 rounded-lg px-3 py-2.5 font-medium text-slate-600">数据保留</a>
    </nav>
    <div class="mt-auto rounded-xl bg-slate-50 p-3 text-xs leading-5 text-slate-500">评分状态与删除操作均保留可追溯审计。</div>
  </aside>
  <header class="sticky top-0 z-10 flex h-16 items-center justify-between border-b border-slate-200 bg-white/95 px-5 backdrop-blur lg:ml-[232px] lg:px-8">
    <div><p class="text-xs text-slate-500">教师工作台</p><h1 class="text-base font-semibold text-[#172033]">{{ pageTitle }}</h1></div>
    <div class="flex items-center gap-3"><span class="hidden text-sm text-slate-500 sm:block">教学评估与复核</span><div class="flex h-8 w-8 items-center justify-center rounded-full bg-[#eaf1fb] text-sm font-semibold text-[#173b67]">师</div></div>
  </header>
  <main class="mx-auto max-w-[1280px] p-5 lg:ml-[232px] lg:p-8"><slot></slot></main>
</div>
