package:
  node_name: submission-core
  layer: L2
  target_node_id: SI-CORE
  parent_node_id: MOD-02
  parent_node_name: submission-intake
  responsibility: >
    在 MOD-02 边界内拥有 Submission 聚合的唯一领域写入口；维护提交生命周期状态机、
    材料清单、完整性报告与缺失项标记；在单一本地事务中提交状态、清单、报告和父层
    Outbox 写入；为 CT-002 提供提交查询，并承接评分回写与清除回写。
  exclusions:
    - 不处理 HTTP、认证、端点路由或 30 秒同步编排（SI-API）。
    - 不拥有 UploadSession、分片、断点续传或暂存材料文件（SI-XFER/SI-STORE）。
    - 不操作文件系统、不决定材料清除范围、不计算保留到期时间（SI-STORE/SI-PURGE/MOD-05）。
    - 不直接向 MOD-04 或 MOD-05 投递事件；仅通过 SI-RELAY 的父层 Outbox 契约写入。
    - 不执行评分、不落地评分依据、建议或原始评分内容（MOD-04/MOD-05）。
    - 不改变父层公开契约、状态值域、数据所有权、部署单元或技术平台。

