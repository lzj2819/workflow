  checks:
    - { check: "四项必需输入已解析且目标节点唯一匹配", result: pass }
    - { check: "输出目录写入前为空，未覆盖既有架构包", result: pass }
    - { check: "四个 L2 child_id 稳定、排序且均有需求/父层追踪", result: pass }
    - { check: "ST-01 仍由 CMP-CS-STATE-STORE 单一持有，未转移给兄弟节点", result: pass }
    - { check: "IC-M01-02 与 IC-M01-05 外部语义、字段、错误和版本约束未改变", result: pass }
    - { check: "未新增父层服务、数据库、消息总线、公共运行时或部署边界", result: pass }
    - { check: "本层决策队列无遗留 decide_now 或 return_to_parent", result: pass }
    - { check: "child-handoff.md 列出实际输入、输出、验证结果和下一层 target_node_id", result: pass }

incomplete_items:
