package:
  node_name: CMP-ASSESSMENT-ENGINE
  layer: L2
  parent_node_id: MOD-04
  target_node_id: CMP-ASSESSMENT-ENGINE
  responsibility: >
    Execute one assessment attempt inside the MOD-04 assessment-worker boundary:
    coordinate prompt composition, read material contents through the MOD-02
    read-only port, invoke the model through the ACL, validate the response,
    assemble the assessment result, and report completion or failure.
  exclusions:
    - Does not own scoring-task lifecycle, leasing, scheduling, retry count, or terminal transactions.
    - Does not persist state, publish CT-005, or own Outbox rows.
    - Does not call the network or model vendor directly.
    - Does not own rubric/template configuration, material storage, teacher presentation, or notification rendering.

