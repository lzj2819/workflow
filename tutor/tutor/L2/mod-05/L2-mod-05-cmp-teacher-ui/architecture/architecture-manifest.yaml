manifest_version: "1.0"

package:
  node_name: teacher-ui
  level: L2
  target_node_id: CMP-TEACHER-UI
  parent_node_id: CMP-TEACHER-UI
  responsibility: >-
    教师网页中的课程/小组/学生/提交查询、批注与最终等级编辑、展示视图浏览、
    删除确认和评分失败/端内通知的可观察面；所有服务端操作均经 CMP-ACCESS-GATE。
  exclusions:
    - 不直连数据库、读模型、Outbox、文件存储或任何兄弟节点内部实现
    - 不实现课程范围授权、ReviewRecord、PresentationView、DeletionBatch 或读模型所有权
    - 不修改 CT-007/CT-008/CT-009/CT-011 的字段、路径、错误、幂等、版本和副作用语义
    - 不绕过 CMP-ACCESS-GATE，不在浏览器端实现服务端业务规则或伪造等级
    - 不创建独立服务、容器、部署单元、公共运行时边界或新的跨模块依赖

inputs:
  parent_architecture: "__PROVENANCE_PATH_REMOVED__"
  target_node_id: CMP-TEACHER-UI
  current_prd: "__PROVENANCE_PATH_REMOVED__"
  output_dir: "__PROVENANCE_PATH_REMOVED__"
  mode: new

parent_package_type: recursive_child_architecture_package
parent_package_detection: >-
  父目录存在 architecture-manifest.yaml，且是已完成的 L1/MOD-05 递归架构包；
  目标节点从父包 manifest、02-architecture-decomposition.md 和 child-handoff.md 三处交叉确认。

