    match: "children 中唯一的 CMP-TEACHER-UI，追踪 REQ-D001/D002"
    kind: exact_unique
  - source: "architecture/L1/L1-mod-05/02-architecture-decomposition.md:60-65"
    match: "直接子节点清单唯一行 CMP-TEACHER-UI；职责为教师网页查询、批注、展示视图和删除确认可观察面"
    kind: exact_unique
  - source: "architecture/L1/L1-mod-05/child-handoff.md:12-21"
    match: "L2 target registry 唯一行 CMP-TEACHER-UI；L2 上下文为 REQ-D001/D002、LCD-007、A-005"
    kind: exact_unique
  - source: "prd/L2-PRD/mod-05/L2-mod-05-cmp-teacher-ui/prd.md frontmatter and acceptance contracts"
    match: "module_name=CMP-TEACHER-UI；REQ-DD001/REQ-DD002；D-AC-REQ-009-01/D-AC-REQ-010-01"
