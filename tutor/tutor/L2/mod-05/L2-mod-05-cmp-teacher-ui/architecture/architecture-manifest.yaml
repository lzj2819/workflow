    - "M05-BIND-CT-008-UI-GATE"
    - "M05-BIND-CT-009-UI-GATE"
    - "M05-BIND-CT-011-UI-GATE"
  decisions: [KD-002, KD-003, KD-005, A-005, LCD-001, LCD-004, LCD-006]
