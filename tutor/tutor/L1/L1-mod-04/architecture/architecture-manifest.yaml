validation_entry_overrides: validation-entry-overrides.json

# Strict validate-arch machine bindings. These bindings make the existing
# architecture semantics explicit without adding a new public API contract.
validation_bindings:
  - scenario_id: SCENARIO-001
    precondition: MOD-02.Submission.processing + material_readability=readable
    state_projection: SP-001
    entry_component: CMP-SCORING-ORCHESTRATOR
    entry_action: ICT-001
    entry_contract_id: ICT-001
  - scenario_id: SCENARIO-002
    precondition: MOD-02.Submission.processing + material_readability=readable
    state_projection: SP-001
    entry_component: CMP-SCORING-ORCHESTRATOR
    entry_action: ICT-001
    entry_contract_id: ICT-001
  - scenario_id: SCENARIO-003
    precondition: MOD-02.Submission.processing + missing_items=non_empty
    state_projection: SP-001
    entry_component: CMP-SCORING-ORCHESTRATOR
    entry_action: ICT-001
    entry_contract_id: ICT-001
  - scenario_id: SCENARIO-004
    precondition: ST-001.in_progress + attempts=1
    state_projection: SP-003
    entry_component: CMP-ASSESSMENT-ENGINE
    entry_action: ICT-006
    entry_contract_id: ICT-006
  - scenario_id: SCENARIO-005
    precondition: ST-001.in_progress + attempts=2
    state_projection: SP-004
    entry_component: CMP-SCORING-ORCHESTRATOR
    entry_action: ICT-006
    entry_contract_id: ICT-006
  - scenario_id: SCENARIO-006
    precondition: course_period + valid_submissions
    entry_component: CMP-SCORING-METRICS
    entry_action: ICT-008
    entry_contract_id: ICT-008
  - scenario_id: SCENARIO-007
    precondition: before_course_end + all_submissions
    entry_component: CMP-SCORING-METRICS
    entry_action: ICT-008
    entry_contract_id: ICT-008
  - scenario_id: SCENARIO-008
    composition: [SCENARIO-004, SCENARIO-005]
    entry_component: CMP-ASSESSMENT-ENGINE
    entry_action: ICT-006
    entry_contract_id: ICT-006

machine_contracts:
  ICT-003:
    provider: MOD-02-MATERIAL-READ-PORT
    consumer: CMP-ASSESSMENT-ENGINE
    kind: query_port
    input: [material_refs]
    output: [materials, readability]
    errors: [MATERIAL_UNREADABLE]
    ownership: MOD-02
    access: read_only
  ICT-008:
    provider: CMP-SCORING-ORCHESTRATOR
    consumer: CMP-SCORING-METRICS
    kind: query
    source_states: [ST-001, ST-002]
    output: [created_at, finished_at, outcome, latency_distribution, backlog, failure_rate, retry_rate]
    read_only: true
