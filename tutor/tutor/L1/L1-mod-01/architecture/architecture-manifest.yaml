  exclusions:
    - 不提供任何服务端网络契约（父包组件接口卡 provides_contracts: []）
    - 不执行课程归属校验（MOD-03 职责，CT-003；MOD-01 不缓存、不预判校验结论）
    - 不持有 Submission 聚合与提交状态机（MOD-02 数据所有权，03-data-and-consistency）
    - 不参与评分、复核与教师端展示（MOD-04 / MOD-05 职责）

