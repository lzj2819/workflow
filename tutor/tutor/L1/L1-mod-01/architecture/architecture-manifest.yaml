  level: L1
  target_node_id: MOD-01
  parent_node_id: MOD-01            # 本次细化的父节点即目标节点本身
  responsibility: >-
    识别含作业/姓名/小组的自然语言提交意图；管理插件配置（邀请码、姓名、小组、三个目录）；
    采集完整对话与材料；分片上传材料包；展示提交编号与失败原因；网络中断时保留本地待上传任务。
