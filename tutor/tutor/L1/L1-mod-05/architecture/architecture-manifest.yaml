# Architecture Manifest — L1 / MOD-05 teacher-web
# 由 recursive-architecture-design 生成；字段语义见 references/artifact-spec.zh-CN

manifest_version: "1.0"

package:
  node_name: teacher-web
  level: L1
  target_node_id: MOD-05
  parent_node_id: MOD-05            # 本次细化的父节点即目标节点本身
  responsibility: >-
    教师课程/小组/学生/提交查询（课程范围授权）；批注与最终等级调整（保留原始等级与调整记录）；
    展示视图生成；评分失败可见；删除确认与审计查看。
    （逐字引自父包 01-system-overview.md「模块职责」MOD-05 条目）
  exclusions:
    - 不接收学生上传、不持有 Submission 聚合与提交状态机、不持有材料文件（MOD-02 数据所有权，03-data-and-consistency）
    - 不执行课程归属校验、不维护课程/邀请码/名单（MOD-03 职责；MOD-05 仅经 FLOW-011 只读引用课程结束时间）
    - 不执行 Agent 评分、不产出原始等级/依据/建议、不接触模型服务（MOD-04 职责；CT-010 与 MOD-05 无关）
    - 不伪造等级：scoring_failed 且无原始等级时不得设置最终等级（CT-008 NO_ORIGINAL_GRADE，DF-2）
    - 不得创建独立服务/容器/部署单元或公共运行时边界（父层定义 MOD-05 为 DU-2 内部节点，06-deployment）
    - 不得修改任何父契约（CT-005/006/007/008/009/011/012/014）的标识、字段、所有者、副作用、失败语义与版本

inputs:
  parent_architecture: architecture/L0/output
  target_node_id: MOD-05
  current_prd: prd/L1/L1-mod-05/prd.md
  parent_prd: prd/L0/vibe-coding-course-prd.md   # 可选输入；实际读取：补充 REQ-009/REQ-010、NFR-001/NFR-004 与 AC-REQ-009-01 / AC-REQ-010-01 / AC-NFR-001-01 / AC-NFR-004-01 原文
  output_dir: architecture/L1/L1-mod-05
  mode: new

parent_package_type: top_level_ddd_to_system_package
parent_package_detection: >-
  父包根无 architecture-manifest.yaml，存在 output/01-system-overview.md，
  按 parent-package-adapter 规则 2 识别为顶层 DDD 到系统架构包。

