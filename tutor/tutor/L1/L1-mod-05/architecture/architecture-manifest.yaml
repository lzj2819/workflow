  - check: "目标节点唯一匹配（01 模块清单 / 04 组件接口卡 / 06 部署映射 + L1 PRD frontmatter 交叉确认，4 条证据）"
    result: pass
  - check: "当前 PRD 不越父边界（REQ-D001/D002 ⊆ REQ-009/REQ-010；无父契约变更诉求）"
    result: pass
  - check: "每个直接 child_id 至少拥有 current REQ-D/NFR-D；内部支撑组件不进入 direct children"
    result: pass
  - check: "C1–C6 映射齐备（02§3 / 03§1 / 04§3 / 04§1 / 04§2 / 01§4）"
    result: pass
  - check: "父契约逐字段不可变（04 §5 自检：路径/字段/错误码/幂等/版本）"
    result: pass
  - check: "状态所有权不越界（03 §5 确认；派生/内部状态不外供）"
    result: pass
  - check: "兄弟节点仅引用未重设计；与 MOD-01 无交互（01 Q-01）"
    result: pass
  - check: "决策队列清零（decide_now 6/6 已决；return_to_parent 0 项）"
    result: pass
  - check: "带 ID 清单按稳定 ID 排序（CMP / ST / M05-IC / LCD）"
    result: pass
  - check: "父契约机器可读字段投影（CT-005/006/007/008/009/011/012/014：required_fields、produced_fields、errors、side_effects、dependencies）"
    result: pass
  - check: "组件入口与路由绑定（教师浏览器→UI→GATE→QUERY/COMMAND/PRESENTATION/RETENTION，以及跨模块事件入口）"
    result: pass
  - check: "本层 local_legal_flows（15 条流均含 entry_condition、next_hop、return_to_caller、terminal_states）"
    result: pass
  - check: "机器解析兼容性（7 个 child_id 规范组件、无展示标签污染、inbound required coverage gap=0）"
    result: pass

