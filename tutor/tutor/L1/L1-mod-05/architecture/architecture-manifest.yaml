  - source: architecture/L0/output/01-system-overview.md §模块清单
    match: "| MOD-05 | teacher-web | BC-REVIEW、BC-RETENTION | REQ-009、REQ-010；NFR-001、NFR-004 |"
    kind: exact_unique                 # 全包检索 module_id=MOD-05 唯一命中
  - source: architecture/L0/output/04-interface-contracts.md §组件接口卡
    match: "component_interfaces 第五条 module_id: MOD-05（provides CT-007/008/009/011；consumes CT-005/006/014；publishes+self-consumes CT-012；internal_reads MOD-03）"
    kind: exact_unique
  - source: architecture/L0/output/06-deployment.md §Module 到部署单元映射
    match: "| MOD-05 | DU-2 | 教师端读多写少，负载低 |"
    kind: exact_unique
  - source: prd/L1/L1-mod-05/prd.md frontmatter
    match: "module_name: MOD-05；REQ-D001 parent_req=REQ-009、REQ-D002 parent_req=REQ-010，与父包 MOD-05 需求追踪（REQ-009、REQ-010）完全一致"
    kind: cross_confirmation

boundary_fingerprint:
  parent_artifacts:
    - "01-system-overview.md：模块清单 MOD-05 行、模块职责、BC-REVIEW/BC-RETENTION 映射与合并理由、SM-003 contributing 定位（modules_without_sm_allocation 登记）"
    - "02-runtime-architecture.md：DF-1 步骤 11–12、DF-2 步骤 6、DF-3；FLOW-007/008/009/010/011/012；SCENARIO-001/012（教师查看终止）、SCENARIO-016（保留删除主场景，entry=MOD-05）"
    - "03-data-and-consistency.md：ReviewRecord / PresentationView / DeletionBatch 聚合归 MOD-05；教师读模型派生说明；本地事务边界；跨边界最终一致；保留期规则（retention_due_at = 课程结束时间 + 1 年，MOD-05 计算）"
    - "04-interface-contracts.md：CT-007 / CT-008 / CT-009 / CT-011 全文（Provider=MOD-05）；CT-005 / CT-006 / CT-012 / CT-014 全文（Consumer/Provider 关系）；错误码汇总；组件接口卡 MOD-05；超时/重试/幂等/版本策略汇总"
    - "05-decisions-and-technology.md：KD-002（共部署+Outbox）、KD-003（基础级运维）、KD-005（/api/v1+幂等键）；教师前端渲染技术与展示视图导出格式 defer_to_detail_design（触发条件：MOD-05 详细设计）"
    - "06-deployment.md：DU-2 course-app（MOD-02/03/05 共部署）；保留治理为 DU-2 内定时批处理；访问拒绝留痕（AccessDeniedLogged）"
    - "acceptance-contract-projections.yaml：AC-REQ-009-01 / AC-REQ-010-01 / AC-NFR-001-01 为 MOD-05 单模块契约；AC-NFR-004-01 disposition=module_local、owning_module=MOD-05、MOD-02 为 execution_dependency"
    - "父层 DDD 产物（architecture/L0/）：aggregates.md（ReviewRecord / PresentationView / DeletionBatch）、domain-flow.md（F3-1~F3-3、F4-1、F5-1~F5-3、DF-2、DF-3）、bounded-contexts.md（BC-REVIEW、BC-RETENTION）、assumptions.md（A-001、A-003、A-005）"
  contracts:
    - "CT-007 教师课程数据查询（Provider，query，read-only；出参含 deletion_batches[]）"
    - "CT-008 教师批注与最终等级调整（Provider，写；NO_ORIGINAL_GRADE；模块内事件不跨模块投递）"
    - "CT-009 展示视图生成（Provider，写；NO_AVAILABLE_SUBMISSION；幂等键=教师+小组集合+时间窗）"
    - "CT-011 删除确认（Provider，同步确认+异步执行；publishes CT-012）"
    - "CT-005 SubmissionScored/ScoringFailed（Consumer；派生复核记录、读模型、端内通知）"
    - "CT-006 SubmissionReceived 读模型派生（Consumer）"
    - "CT-012 RecordsDeleted（Provider + 模块内自消费清除读模型）"
    - "CT-014 PurgeCompleted（Consumer；更新批次执行状态）"
    - "FLOW-011 课程结束时间只读引用（internal_read，无网络契约，contract: none）"
  decisions: [KD-002, KD-003, KD-005, A-001, A-003, A-005]
  ownership: "MOD-05 拥有 ReviewRecord、PresentationView、DeletionBatch 聚合与教师读模型（派生，可重放重建）；其余聚合所有权不进入本节点"
  deployment: "DU-2 course-app（与 MOD-02/MOD-03 共部署，共享数据库与本地磁盘；保留治理定时批处理运行于 DU-2 内）"

