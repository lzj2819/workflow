    consumes_api: [CT-003]
    consumes_events: [CT-005, CT-012]
    publishes_events: [CT-004, CT-006, CT-014]
    source: "04-interface-contracts.md「组件接口卡」MOD-02 条及各契约 contract_fields"
  state_and_data_ownership: "03-data-and-consistency.md「数据所有权」Submission 行: 提交记录、状态机、材料清单、材料文件、完整性报告、上传失败原因;本地事务边界=状态迁移+材料清单+完整性报告"
