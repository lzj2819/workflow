# Architecture Manifest — L1 模块架构包清单
# 由 recursive-architecture-design 生成（mode: new）
# 状态机: draft → ready_for_human_gate | blocked_parent_change

package:
  node_name: submission-intake
  layer: L1
  target_node_id: MOD-02
  responsibility: >
    材料包接收(500MB 上限、类型白名单,KD-004);提交生命周期状态机
    (upload_failed/rejected/received/processing/scored/scoring_failed);
    完整性报告与缺失项标记;30 秒内返回接收确认;发布 SubmissionReceived 事件;
    执行保留期数据清除并回传清除结果(CT-014);
    提供 POST /api/v1/auth/token 令牌签发(KD-005,CT-001 契约族附属)
  exclusions:
    - 不采集对话与材料(MOD-01 codex-plugin,DU-1)
    - 不持有课程/邀请码/名单数据(MOD-03);每次提交经 CT-003 重新校验,不缓存通过结论(REQ-006)
    - 不执行 Agent 评分与评分重试(MOD-04,DU-3)
    - 不提供教师端查询/批注/展示/删除确认(MOD-05)
    - 不计算保留到期时间、不持有删除批次与审计记录(MOD-05);仅按 CT-012 submission_ids[] 执行清除并经 CT-014 回传

