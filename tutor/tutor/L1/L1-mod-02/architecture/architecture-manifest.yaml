    storage: "单一关系型数据库(结构化)+ 本地磁盘加密(材料文件),DU-2/DU-3 共享设施(KD-002/KD-003)"
    deployment: "06-deployment.md DU-2 course-app(MOD-02/03/05 同部署单元);MOD-02 支撑 30 并发上传(NFR-002);不新增部署单元"
    deferred_by_parent: ["数据库产品选型(defer_to_detail_design)"]
