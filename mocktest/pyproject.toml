[tool.poetry]
name = "mock-test-framework"
version = "2.0.0"
description = "Mocktest v2 - canonical Architecture/Testcases strict validation"
authors = ["Workflow Team"]
readme = "README.md"
packages = [{include = "mock_framework", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
pyyaml = "^6.0"
gherkin-official = "^24.0"
jsonschema = "^4.0"
rich = "^13.0"
openai = "^1.0"
anthropic = "^0.30"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
black = "^23.0"
mypy = "^1.0"

[tool.poetry.scripts]
mock-test = "mock_framework.canonical_cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=mock_framework --cov-report=term-missing"
python_classes = ["Test*"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.coverage.run]
source = ["mock_framework"]
omit = ["*/tests/*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''
